substitutions:
  # The ID of the LED on your board used for this component
  rs485_status_led_id: "virtual_status_light"

esphome:
  on_boot:
    - priority: 300.0
      then:
        - lambda: |-
            // 1. Deklarasikan variabel eksternal buatan ESPHome
            extern esphome::globals::GlobalsComponent<bool> *global_rs232_lock;
  
            // 2. Deklarasikan pointer di namespace pylontech_rs485
            namespace esphome {
              namespace pylontech_rs485 {
                extern globals::GlobalsComponent<bool> *pylon_rs232_lock_ptr;
              }
            }
  
            // 3. Masukkan pointer objek global ke pointer pylontech
            esphome::pylontech_rs485::pylon_rs232_lock_ptr = global_rs232_lock;
            
    - priority: 600.0
      then:
        - lambda: |-
            // Register System
            id(global_register_led)(${CAT_INV_RS485}, ${rs485_id}, id(${rs485_status_led_id}));
            // Force register fault as default, will be updated once RS485 is working
            // (true = fault)
            id(global_update_fault)(${CAT_INV_RS485}, ${rs485_id}, true);          
    - priority: -100.0
      then:
        - lambda: |-
            // Initialise rs485 status as off
            id(rs485${rs485_id}_status).publish_state(false);

  devices:
    - id: rs485_${rs485_id}
      name: "${yambms_name} ${rs485_name}"

external_components:
  - source: github://pakipul/esphome-pylontech-rs485@main
    refresh: 0s

uart:
  - id: !extend ${rs485_uart_id}
    baud_rate: ${rs485_uart_baud_rate}
  - id: !extend ${rs232_uart_id}
    baud_rate: ${rs232_uart_baud_rate}
    
globals:
  - id: rs232_lock
    type: bool
    restore_value: no
    initial_value: 'false'
select:
  - platform: template
    name: "YamBMS protocol"
    id: rs485${rs485_id}_protocol
    device_id: rs485_${rs485_id}
    options:
      - "Pylontech"
      - "Disabled"
    restore_value: true
    initial_option: "Pylontech"
    optimistic: true
    entity_category: config

switch:
  - platform: template
    name: "Inverter Heartbeat Monitoring"
    id: rs485${rs485_id}_switch_inverter_heartbeat_monitoring
    device_id: rs485_${rs485_id}
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    entity_category: diagnostic


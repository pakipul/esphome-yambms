    name: "Status"
    entity_category: diagnostic
    trigger_on_initial_state: true
    on_state:
      then:
        - lambda: |-
            // Pass the current state to the update function
            id(global_update_fault)(${CAT_INV_RS485}, ${rs485_id}, !x);
text_sensor:
  - platform: template
    name: "Raw Response HEX"
    id: rs232${rs485_id}_raw_response_hex
    icon: "mdi:hexadecimal"
    
  - platform: template
    id: rs232${rs485_id}_tcontroller_connected
    name: "Controller Connected State"

  - platform: template
    id: rs232${rs485_id}_tcharging_state
    name: "Charging State"
    
  - platform: template
    id: rs232${rs485_id}_tbattery_full
    name: "Battery Full"
    
interval:
  - interval: ${rs232_interval}
    then:
      # Langkah 1: Kunci jalur agar RS485 menahan balasan sementara
      - lambda: |-
          id(rs232_lock) = true;

          // Clear buffer RX sebelum mengirim perintah
          while (id(${rs232_uart_id}).read_byte(nullptr));

          // Kirim Perintah Hex RS232
          uint8_t cmd[] = {0x43, 0x4D, 0x53, 0x47, 0x06, 0x49, 0x4E, 0x56, 0x2D, 0x48, 0x42};
          id(${rs232_uart_id}).write_array(cmd, sizeof(cmd));

      # Langkah 2: Beri jeda non-blocking untuk membiarkan data masuk ke buffer RX
      - delay: 200ms

      # Langkah 3: Baca dan parsing data dari buffer RS232
      - lambda: |-
          std::vector<uint8_t> response;
          uint8_t data;
          while (id(${rs232_uart_id}).read_byte(&data)) {
            response.push_back(data);
          }

          if (response.size() >= 86) {
            // Convert to HEX string
            char hex_buf[400];
            int pos = 0;
            for (size_t i = 0; i < 86; i++) {
              if (i > 0 && i % 16 == 0) {
                pos += snprintf(hex_buf + pos, sizeof(hex_buf) - pos, "\n");
              }
              pos += snprintf(hex_buf + pos, sizeof(hex_buf) - pos, "%02X ", response[i]);
            }
            id(rs232${rs485_id}_raw_response_hex).publish_state(hex_buf);

            // Parsing Sensors
            uint16_t raw_v_in = (response[18] << 8) | response[17];
            id(rs232${rs485_id}_input_voltage).publish_state(raw_v_in / 10.0);

            uint16_t raw_f_in = (response[20] << 8) | response[19];
            id(rs232${rs485_id}_input_frequency).publish_state(raw_f_in / 10.0);

            uint16_t raw_v_out = (response[22] << 8) | response[21];
            id(rs232${rs485_id}_output_voltage).publish_state(raw_v_out / 10.0);

            uint16_t raw_f_out = (response[24] << 8) | response[23];
            id(rs232${rs485_id}_output_frequency).publish_state(raw_f_out / 10.0);

            uint16_t raw_v_bat = (response[26] << 8) | response[25];
            id(rs232${rs485_id}_battery_voltage).publish_state(raw_v_bat / 10.0);

            uint16_t cap_bat = (response[28] << 8) | response[27];
            id(rs232${rs485_id}_battery_capacity).publish_state(cap_bat);

            id(rs232${rs485_id}_load_percentage).publish_state(response[29]);
            id(rs232${rs485_id}_inverter_temperature).publish_state(response[30]);

            uint16_t raw_pv_v = (response[40] << 8) | response[39];
            id(rs232${rs485_id}_pv_voltage).publish_state(raw_pv_v);

            uint16_t raw_pv_c = response[41];
            id(rs232${rs485_id}_solar_charge_current).publish_state(raw_pv_c);

            id(rs232${rs485_id}_charger_temperature).publish_state(response[42]);

            float pv_p = raw_v_bat * raw_pv_c;
            id(rs232${rs485_id}_solar_power).publish_state(pv_p / 10.0);

            id(rs232${rs485_id}_controller_connecter).publish_state((response[5] >> 3) & 1);
            id(rs232${rs485_id}_charging_status).publish_state((response[5] >> 2) & 1);
            id(rs232${rs485_id}_battery_full_status).publish_state(response[5] & 1);

            id(rs232${rs485_id}_tcontroller_connected).publish_state(((response[5] >> 3) & 1) ? "Connected" : "Not Connected");
            id(rs232${rs485_id}_tcharging_state).publish_state(((response[5] >> 2) & 1) ? "Charging" : "Not Charging");
            id(rs232${rs485_id}_tbattery_full).publish_state((response[5] & 1) ? "Full Charge" : "Not Full Charge");
          }

      # Langkah 4: Beri jeda lengang (Quiet Time) agar port komunikasi internal inverter netral
      - delay: 1000ms

      # Langkah 5: Buka kembali kunci rs232_lock untuk membiarkan RS485 merespons
      - lambda: |-
          id(rs232_lock) = false;
  - interval: 24h
    then:
      - lambda: |-
          // Save RS485 options
          id(yambms${yambms_id}_var_inverter_bms_name) = "RS485";
          id(yambms${yambms_id}_var_inverter_protocol) = id(rs485${rs485_id}_protocol).current_option();

  - interval: 100ms
    then:
      - if:
          condition:
            lambda: 'return id(rs485${rs485_id}_protocol).current_option() == "Pylontech";'
          then:
            - lambda: !lambda |-
                // Mirror RS485 status into inverter_com_status
                if (id(rs485${rs485_id}_status).has_state()) id(inverter_com_status).publish_state(id(rs485${rs485_id}_status).state);

                // --- Check YamBMS initialized + BMS ONLINE/OFFLINE status ---  
                if ((id(yambms${yambms_id}_var_initialized) == true) && (id(yambms${yambms_id}_bms_combined).state > 0))
                {
                  // --- STATE 1: BMS is ONLINE ---
                  // Sensor Values
                  if (id(yambms${yambms_id}_battery_soc).has_state()) id(rs485${rs485_id}_proxy_soc).publish_state(id(yambms${yambms_id}_battery_soc).state);
                  if (id(yambms${yambms_id}_total_voltage).has_state()) id(rs485${rs485_id}_proxy_voltage).publish_state(id(yambms${yambms_id}_total_voltage).state);
                  if (id(yambms${yambms_id}_current).has_state()) id(rs485${rs485_id}_proxy_current).publish_state(id(yambms${yambms_id}_current).state);
                  if (id(yambms${yambms_id}_max_temperature).has_state()) id(rs485${rs485_id}_proxy_temperature).publish_state(id(yambms${yambms_id}_max_temperature).state);
                  if (id(yambms${yambms_id}_battery_soh).has_state()) id(rs485${rs485_id}_proxy_soh).publish_state(id(yambms${yambms_id}_battery_soh).state);
                  if (id(yambms${yambms_id}_charging_cycles).has_state()) id(rs485${rs485_id}_proxy_cycle_count).publish_state(id(yambms${yambms_id}_charging_cycles).state);
                  if (id(yambms${yambms_id}_max_cell_voltage).has_state()) id(rs485${rs485_id}_proxy_max_cell_v).publish_state(id(yambms${yambms_id}_max_cell_voltage).state);
                  if (id(yambms${yambms_id}_min_cell_voltage).has_state()) id(rs485${rs485_id}_proxy_min_cell_v).publish_state(id(yambms${yambms_id}_min_cell_voltage).state);
                  if (id(yambms${yambms_id}_max_temperature).has_state()) id(rs485${rs485_id}_proxy_max_temp).publish_state(id(yambms${yambms_id}_max_temperature).state);
                  if (id(yambms${yambms_id}_min_temperature).has_state()) id(rs485${rs485_id}_proxy_min_temp).publish_state(id(yambms${yambms_id}_min_temperature).state);
                  if (id(yambms${yambms_id}_requested_charge_voltage).has_state()) id(rs485${rs485_id}_proxy_max_charge_v).publish_state(id(yambms${yambms_id}_requested_charge_voltage).state);
                  if (id(yambms${yambms_id}_requested_discharge_voltage).has_state()) id(rs485${rs485_id}_proxy_min_discharge_v).publish_state(id(yambms${yambms_id}_requested_discharge_voltage).state);
                  if (id(yambms${yambms_id}_requested_charge_current).has_state()) id(rs485${rs485_id}_proxy_max_charge_i).publish_state(id(yambms${yambms_id}_requested_charge_current).state);
                  if (id(yambms${yambms_id}_requested_discharge_current).has_state()) id(rs485${rs485_id}_proxy_max_discharge_i).publish_state(id(yambms${yambms_id}_requested_discharge_current).state);
                  // Binary Sensors (Alarms/Protections)
                  if (id(yambms${yambms_id}_errors_bitmask_warning).has_state()) {
                    uint16_t mask = id(yambms${yambms_id}_errors_bitmask_warning).state;
                    id(rs485${rs485_id}_proxy_total_voltage_high_alarm).publish_state((mask & 0x0002) > 0);
                    id(rs485${rs485_id}_proxy_total_voltage_low_alarm).publish_state((mask & 0x0004) > 0);
                    id(rs485${rs485_id}_proxy_cell_temp_high_alarm).publish_state((mask & 0x0008) > 0);
                    id(rs485${rs485_id}_proxy_cell_temp_low_alarm).publish_state((mask & 0x0010) > 0);
                    id(rs485${rs485_id}_proxy_charge_overcurrent_alarm).publish_state((mask & 0x0100) > 0);
                    id(rs485${rs485_id}_proxy_discharge_overcurrent_alarm).publish_state((mask & 0x0080) > 0);
                    id(rs485${rs485_id}_proxy_cell_imbalance_alarm).publish_state((mask & 0x1000) > 0);
                    id(rs485${rs485_id}_proxy_cell_voltage_high_alarm).publish_state((mask & 0x0002) > 0);
                    id(rs485${rs485_id}_proxy_cell_voltage_low_alarm).publish_state((mask & 0x0004) > 0);
                  }
                  if (id(yambms${yambms_id}_errors_bitmask_alarm).has_state()) {
                    uint16_t mask = id(yambms${yambms_id}_errors_bitmask_alarm).state;
                    id(rs485${rs485_id}_proxy_cell_overvoltage_protection).publish_state((mask & 0x0002) > 0);
                    id(rs485${rs485_id}_proxy_cell_undervoltage_protection).publish_state((mask & 0x0004) > 0);
                    id(rs485${rs485_id}_proxy_cell_overtemp_protection).publish_state((mask & 0x0008) > 0);
                    id(rs485${rs485_id}_proxy_cell_undertemp_protection).publish_state((mask & 0x0010) > 0);
                    id(rs485${rs485_id}_proxy_charge_overcurrent_protection).publish_state((mask & 0x0100) > 0);
                    id(rs485${rs485_id}_proxy_discharge_overcurrent_protection).publish_state((mask & 0x0080) > 0);
                    id(rs485${rs485_id}_proxy_system_fault_protection).publish_state((mask & 0x0800) > 0);
                  }
                } else {
                  // --- STATE 2: BMS is OFFLINE ---
                  // Invalidate all proxy sensors to trigger component's fail-safe.
                  id(rs485${rs485_id}_proxy_soc).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_voltage).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_current).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_temperature).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_soh).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_cycle_count).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_max_cell_v).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_min_cell_v).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_max_temp).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_min_temp).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_max_charge_v).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_min_discharge_v).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_max_charge_i).publish_state(NAN);
                  id(rs485${rs485_id}_proxy_max_discharge_i).publish_state(NAN);

                  // Publish 'false' to clear any alarms/protections.
                  id(rs485${rs485_id}_proxy_total_voltage_high_alarm).publish_state(false);
                  id(rs485${rs485_id}_proxy_total_voltage_low_alarm).publish_state(false);
                  id(rs485${rs485_id}_proxy_cell_temp_high_alarm).publish_state(false);
                  id(rs485${rs485_id}_proxy_cell_temp_low_alarm).publish_state(false);
                  id(rs485${rs485_id}_proxy_charge_overcurrent_alarm).publish_state(false);
                  id(rs485${rs485_id}_proxy_discharge_overcurrent_alarm).publish_state(false);
                  id(rs485${rs485_id}_proxy_cell_imbalance_alarm).publish_state(false);
                  id(rs485${rs485_id}_proxy_cell_voltage_high_alarm).publish_state(false);
                  id(rs485${rs485_id}_proxy_cell_voltage_low_alarm).publish_state(false);
                  id(rs485${rs485_id}_proxy_cell_overvoltage_protection).publish_state(false);
                  id(rs485${rs485_id}_proxy_cell_undervoltage_protection).publish_state(false);
                  id(rs485${rs485_id}_proxy_cell_overtemp_protection).publish_state(false);
                  id(rs485${rs485_id}_proxy_cell_undertemp_protection).publish_state(false);
                  id(rs485${rs485_id}_proxy_charge_overcurrent_protection).publish_state(false);
                  id(rs485${rs485_id}_proxy_discharge_overcurrent_protection).publish_state(false);
                  id(rs485${rs485_id}_proxy_system_fault_protection).publish_state(false);
                }

pylontech_rs485:
  uart_id: ${rs485_uart_id}
  update_timeout: ${rs485_update_timeout}
  # --- Link to PROXY sensors ---
  state_of_charge: rs485${rs485_id}_proxy_soc
  voltage: rs485${rs485_id}_proxy_voltage
  current: rs485${rs485_id}_proxy_current
  temperature: rs485${rs485_id}_proxy_temperature
  state_of_health: rs485${rs485_id}_proxy_soh
  cycle_count: rs485${rs485_id}_proxy_cycle_count
  max_cell_voltage: rs485${rs485_id}_proxy_max_cell_v
  min_cell_voltage: rs485${rs485_id}_proxy_min_cell_v
  max_temperature: rs485${rs485_id}_proxy_max_temp
  min_temperature: rs485${rs485_id}_proxy_min_temp
  mosfet_temperature: rs485${rs485_id}_proxy_temperature
  max_mosfet_temperature: rs485${rs485_id}_proxy_max_temp
  min_mosfet_temperature: rs485${rs485_id}_proxy_min_temp
  bms_temperature: rs485${rs485_id}_proxy_temperature
  max_bms_temperature: rs485${rs485_id}_proxy_max_temp
  min_bms_temperature: rs485${rs485_id}_proxy_min_temp
  total_voltage_high_alarm: rs485${rs485_id}_proxy_total_voltage_high_alarm
  total_voltage_low_alarm: rs485${rs485_id}_proxy_total_voltage_low_alarm
